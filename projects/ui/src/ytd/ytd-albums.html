<section class="ytd-page" aria-label="Year to date top albums">
  <lib-ytd-header title="Top Albums" periodId="ytd-albums-period" [selectedPeriod]="selectedPeriod()"
    [periodOptions]="periodOptions()" (periodChange)="selectPeriod($event)"></lib-ytd-header>

  @if (loading()) {
  <section class="panel panel--loading" aria-live="polite">
    <p>Loading year-to-date streaming data&hellip;</p>
  </section>
  } @else {
  <lib-ytd-top-albums [albums]="albumTotals()" [isYtdPeriod]="isYtdPeriod()" [periodLabel]="periodLabel()"></lib-ytd-top-albums>
  }
</section>
