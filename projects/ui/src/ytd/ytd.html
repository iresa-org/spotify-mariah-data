<section class="ytd-page" aria-label="Year to date top songs and albums">
    <header class="page-header">
        <div>
            <p class="page-header__eyebrow">Year-to-date</p>
            <h2 class="page-header__title">Top Tracks &amp; Album Streams</h2>
        </div>

        <div class="period-picker">
            <label class="period-picker__label" for="ytd-period">Period</label>
            <select id="ytd-period" class="period-picker__select" [value]="selectedPeriod()"
                (change)="selectPeriod($any($event.target).value)">
                @for (option of periodOptions(); track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
                }
            </select>
        </div>
    </header>

    @if (loading()) {
    <section class="panel panel--loading" aria-live="polite">
        <p>Loading year-to-date streaming data…</p>
    </section>
    } @else {
    <lib-ytd-top-tracks [tracks]="topTracks()" [isYtdPeriod]="isYtdPeriod()" [periodLabel]="periodLabel()"></lib-ytd-top-tracks>

    <lib-ytd-top-albums [albums]="albumTotals()" [isYtdPeriod]="isYtdPeriod()" [periodLabel]="periodLabel()"></lib-ytd-top-albums>
    }

    @if (showScrollToTop()) {
    <button type="button" class="scroll-top-btn" aria-label="Scroll back to top" (click)="scrollToTop()">
        Back to top
    </button>
    }
</section>
