name: Cut release from test_data branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (4-digit year, e.g. 2026)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{4}$ ]]; then
            echo "::error::Version must be a 4-digit year (e.g. 2026), got '$VERSION'."
            exit 1
          fi

      - name: Checkout test_data branch
        uses: actions/checkout@v6
        with:
          ref: test_data
          fetch-depth: 0

      - name: Ensure tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --verify-tag \
            --generate-notes
