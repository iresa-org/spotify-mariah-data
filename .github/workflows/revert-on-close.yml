name: Revert branch to data on unmerged PR close

# Triggers when a PR is closed without being merged, then resets the PR's
# head branch back to match the latest `data` branch, discarding the
# unmerged changes.
on:
  pull_request:
    types: [closed]
    branches: [test_data]

jobs:
  revert-to-data:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout PR head branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
        persist-credentials: true

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull latest data branch
      run: git fetch origin data

    - name: Reset branch to data
      run: git reset --hard origin/data

    - name: Push reset branch
      run: git push --force origin "${{ github.event.pull_request.head.ref }}"
