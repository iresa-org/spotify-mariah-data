name: Run Spotify charts

on:
  workflow_dispatch:

jobs:
  charts:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.16
        uses: actions/setup-node@v6
        with:
          node-version: 24.16

      - name: Install
        run: npm ci

      - name: Run charts
        env:
          SPOTIFY_CHARTS_STORAGE_STATE: ${{ secrets.SPOTIFY_CHARTS_STORAGE_STATE }}
          SPOTIFY_CHARTS_HEADLESS: false
          CI: true
        run: |
          test -n "$SPOTIFY_CHARTS_STORAGE_STATE"
          xvfb-run -a npm run charts

      - name: Commit chart data
        uses: stefanzweifel/git-auto-commit-action@v7