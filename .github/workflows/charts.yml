name: Run Spotify charts

on:
  workflow_dispatch:

jobs:
  charts:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.16
        uses: actions/setup-node@v6
        with:
          node-version: 24.16

      - name: Install
        run: npm ci

      - name: Run charts
        env:
          SPOTIFY_CHARTS_STORAGE_STATE: ${{ secrets.SPOTIFY_CHARTS_STORAGE_STATE }}
          CI: true
        shell: bash
        run: |
          test -n "$SPOTIFY_CHARTS_STORAGE_STATE"
          set -o pipefail
          npm run charts 2>&1 | tee "$RUNNER_TEMP/charts.log"

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit chart data
        uses: stefanzweifel/git-auto-commit-action@v7

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (apt update && apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt update
          apt install gh -y

      - name: Open PR to sync changes into data branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$BRANCH_NAME" = "data" ]; then
            echo "Current branch is data; no sync PR is needed."
            exit 0
          fi

          existing_pr=$(gh pr list --base data --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already exists, skipping."
            exit 0
          fi

          gh pr create --base data --head "$BRANCH_NAME" \
            --title "Sync stats into data" \
            --body-file "$RUNNER_TEMP/charts.log"