# This is a basic workflow to help you get started with Actions

name: Scan for stats

on:
  workflow_dispatch: # Enables the manual trigger button

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  scan-stats:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      # Required for the `gh pr create` step to open a PR into the data branch.
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}
        # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
        persist-credentials: true

    # Running inside a container image gives files a different owner UID than the
    # Actions runner expects, so git refuses to operate on the checkout ("dubious
    # ownership") and later git commands (including git-auto-commit-action) silently
    # see no changes. Mark the workspace as safe before any other git command runs.
    - name: Mark workspace as safe for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Use Node.js 24.16
      uses: actions/setup-node@v6
      with:
        node-version: 24.16

    - name: Install
      run: npm ci

    - name: Scan Spotify data
      run: node scripts/update_data.ts

    - name: Run daily
      run: node scripts/daily.ts

    - name: Find diff
      run: node scripts/diff.ts
    
    - name: Check records
      run: node scripts/record.ts
  
    - name: Calculate YTD
      run: node scripts/ytd.ts
    
    - name: Calculate Monthly
      run: node scripts/monthly.ts

    - name: Update historical
      run: node scripts/historical.ts
    
    - name: Update README
      run: node scripts/update_readme.ts

    - name: Commit all changed files back to the repository
      if: success()
      uses: stefanzweifel/git-auto-commit-action@v7

    - name: Install GitHub CLI
      if: success()
      run: |
        type -p curl >/dev/null || (apt update && apt install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
        apt update
        apt install gh -y

    - name: Open PR to sync changes into data branch
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr create --base data --head "${{ github.ref_name }}" \
          --title "Sync stats into data" \
          --body-file README.md \
          || echo "PR already exists, skipping"


        

