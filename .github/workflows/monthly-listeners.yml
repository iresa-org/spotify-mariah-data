name: Monitor Spotify monthly listeners

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24.16
        uses: actions/setup-node@v6
        with:
          node-version: 24.16

      - name: Install
        run: npm ci

      - name: Monitor monthly listeners
        id: monitor
        run: node scripts/check_monthly_listeners.ts

      - name: Disable monthly listener monitor
        if: steps.monitor.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.disableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'monthly-listeners.yml'
            });
            console.log('Monthly listener monitor disabled after detecting a change.');